<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SIP Requests</title>
  <link rel="icon" href="images/logo.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background: #f5f7fa;
    }

    #container {
      width: 90%;
      margin: 20px auto;
    }

    h1 {
      text-align: center;
      margin-top: 20px;
      color: #004aad;
      font-size: 2.5rem;
    }

    .sip-card {
      background: white;
      padding: 25px;
      margin: 20px 0;
      border-radius: 12px;
      box-shadow: 0 5px 10px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
      position: relative;
    }

    .sip-card:hover {
      background: #eef3fa;
      transform: scale(1.02);
    }

    .sip-details p {
      margin: 8px 0;
      font-size: 17px;
    }

    .sip-actions {
      margin-top: 15px;
      display: flex;
      gap: 15px;
    }

    .accept-btn, .reject-btn, .delete-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .accept-btn {
      background-color: #28a745;
      color: white;
    }

    .accept-btn:hover {
      background-color: #1e7e34;
    }

    .reject-btn {
      background-color: #dc3545;
      color: white;
    }

    .reject-btn:hover {
      background-color: #bd2130;
    }

    .delete-btn {
      background-color: #ffc107;
      color: black;
    }

    .delete-btn:hover {
      background-color: #e0a800;
    }

    /* Navbar & Footer */
    #nav {
      background-color: #2c005f;
      padding: 10px 20px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #list {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    #list li a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    #footer {
      background-color: #111827;
      color: white;
      padding: 20px;
      margin-top: 50px;
    }

    .footer-container {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .footer-container div {
      margin: 10px;
    }
  </style>
</head>

<body>

<div id="container">

  <!-- Navbar -->
  <nav id="nav">
    <div>
      <img src="images/logo.png" alt="Logo" height="40px">
    </div>
    <ul id="list">
      <li><a href="staff.html">Dashboard</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="staff-login.html">Logout</a></li>
    </ul>
  </nav>

  <h1>SIP Requests</h1>

  <div id="sip-requests">
    <!-- SIP Requests added dynamically -->
  </div>

  <!-- Footer -->
  <footer id="footer">
    <div class="footer-container">
      <div>
        <h3>Navigation</h3>
        <p>Dashboard<br>About Us<br>Contact</p>
      </div>
      <div>
        <h3>Head Office</h3>
        <p>1234 Finance Street, Mumbai, India<br>Contact: +91 4564637282</p>
      </div>
      <div>
        <h3>Follow Us</h3>
        <p>YouTube, Instagram, Facebook</p>
      </div>
    </div>
  </footer>

</div>

<script>
  const sipRequests = [
    { name: "Aman Verma", email: "aman@gmail.com", phone: "9876543210", account: "1234567890", amount: "₹5,000/month", duration: "5 years" },
    { name: "Neha Sinha", email: "neha@gmail.com", phone: "9123456780", account: "2345678901", amount: "₹3,000/month", duration: "10 years" },
    { name: "Rahul Gupta", email: "rahul@gmail.com", phone: "9012345678", account: "3456789012", amount: "₹7,500/month", duration: "7 years" },
    { name: "Pooja Mehta", email: "pooja@gmail.com", phone: "9324567810", account: "4567890123", amount: "₹2,000/month", duration: "15 years" },
    { name: "Karan Singh", email: "karan@gmail.com", phone: "9876512340", account: "5678901234", amount: "₹10,000/month", duration: "3 years" },
    { name: "Aman Verma", email: "aman@gmail.com", phone: "9876543210", account: "1234567890", amount: "₹5,000/month", duration: "5 years" },
    { name: "Neha Sinha", email: "neha@gmail.com", phone: "9123456780", account: "2345678901", amount: "₹3,000/month", duration: "10 years" },
    { name: "Rahul Gupta", email: "rahul@gmail.com", phone: "9012345678", account: "3456789012", amount: "₹7,500/month", duration: "7 years" },
    { name: "Pooja Mehta", email: "pooja@gmail.com", phone: "9324567810", account: "4567890123", amount: "₹2,000/month", duration: "15 years" },
    { name: "Karan Singh", email: "karan@gmail.com", phone: "9876512340", account: "5678901234", amount: "₹10,000/month", duration: "3 years" },
  ];

  const requestsContainer = document.getElementById('sip-requests');

  sipRequests.forEach((req, index) => {
    const card = document.createElement('div');
    card.className = 'sip-card';
    card.id = `card-${index}`;
    card.innerHTML = `
      <div class="sip-details">
        <p><strong>Name:</strong> ${req.name}</p>
        <p><strong>Email:</strong> ${req.email}</p>
        <p><strong>Phone:</strong> ${req.phone}</p>
        <p><strong>Account Number:</strong> ${req.account}</p>
        <p><strong>Investment Amount:</strong> ${req.amount}</p>
        <p><strong>Investment Duration:</strong> ${req.duration}</p>
      </div>
      <div class="sip-actions">
        <button class="accept-btn" onclick="handleDecision('${req.email}', 'accepted')">Accept</button>
        <button class="reject-btn" onclick="handleDecision('${req.email}', 'rejected')">Reject</button>
        <button class="delete-btn" onclick="deleteRequest('card-${index}')">Delete Request</button>
      </div>
    `;
    requestsContainer.appendChild(card);
  });

  function handleDecision(email, decision) {
    alert(`A mail has been sent to ${email} regarding the ${decision.toUpperCase()} decision.`);
  }

  function deleteRequest(cardId) {
    const card = document.getElementById(cardId);
    if (card) {
      card.remove();
      alert('Request deleted successfully!');
    }
  }
</script>

</body>
</html>
