<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delete Customer</title>
  <link rel="icon" href="images/logo.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background: #f5f7fa;
    }

    #container {
      width: 60%;
      margin: 50px auto;
      padding: 20px;
      background: white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      border-radius: 8px;
    }

    h1 {
      text-align: center;
      color: #004aad;
      font-size: 2rem;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .form-group button {
      width: 100%;
      padding: 12px;
      background-color: #dc3545;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .form-group button:hover {
      background-color: #c82333;
    }

    #error-message {
      color: red;
      font-weight: bold;
      text-align: center;
    }

    #confirmation-message {
      color: green;
      font-weight: bold;
      text-align: center;
    }

    /* Navbar & Footer */
    #nav {
      background-color: #2c005f;
      padding: 10px 20px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #list {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    #list li a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    #footer {
      background-color: #111827;
      color: white;
      padding: 20px;
      text-align: center;
      margin-top: 30px;
    }

  </style>
</head>

<body>

  <!-- Navbar -->
  <nav id="nav">
    <div>
      <img src="images/logo.png" alt="Logo" height="40px">
    </div>
    <ul id="list">
      <li><a href="staff.html">Dashboard</a></li>
      <!-- <li><a href="delete-customer.html">Delete Customer</a></li> -->
      <li><a href="contact.html">Contact</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="login.html">Logout</a></li>
    </ul>
  </nav>

  <div id="container">
    <h1>Delete Customer</h1>

    <form id="delete-customer-form">
      <div class="form-group">
        <label for="account-number">Account Number</label>
        <input type="text" id="account-number" name="account-number" required>
      </div>

      <div class="form-group">
        <label for="mobile">Mobile Number</label>
        <input type="text" id="mobile" name="mobile" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <button type="submit">Delete Account</button>
      </div>

      <div id="error-message" style="display:none;">
        Account doesn't exist! Please check the Account Number.
      </div>

      <div id="confirmation-message" style="display:none;">
        Account deleted successfully!
      </div>
    </form>
  </div>

  <footer id="footer">
    <p>&copy; 2025 Your Company Name | All Rights Reserved</p>
  </footer>

  <script>
    document.getElementById('delete-customer-form').addEventListener('submit', function (event) {
      event.preventDefault();

      const accountNumber = document.getElementById('account-number').value;
      const mobile = document.getElementById('mobile').value;
      const email = document.getElementById('email').value;
      
      // Validate account number length (10 digits)
      if (accountNumber.length !== 10 || isNaN(accountNumber)) {
        document.getElementById('error-message').style.display = 'block';
        document.getElementById('confirmation-message').style.display = 'none';
        return;
      }

      // Dummy account deletion (this would be handled by the backend in a real application)
      alert(`The account with Account Number: ${accountNumber} has been deleted successfully.`);
      
      // Show confirmation message
      document.getElementById('confirmation-message').style.display = 'block';
      document.getElementById('error-message').style.display = 'none';

      // Dummy email sending (this would be handled by the backend in a real application)
      alert(`A confirmation email has been sent to ${email} regarding the successful deletion of the account.`);

      // Optionally, reset form after submission
      event.target.reset();
    });
  </script>

</body>
</html>
